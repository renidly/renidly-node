name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) + provenance — no token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted Publishing needs a recent npm CLI (>= 11.5.1).
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
      # If you use a token instead of Trusted Publishing, drop the id-token
      # permission and the line above becomes:
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
